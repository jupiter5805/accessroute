<!DOCTYPE html>
<html>
<head>
  <title>AccessRoute Manchester</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <style>
    body { margin: 0; font-family: Arial; }
    #map { height: 100vh; }
    #status {
      position: absolute;
      top: 10px;
      left: 50px;
      z-index: 1000;
      background: white;
      padding: 8px 12px;
      border-radius: 6px;
    }
  #legend {
      position: absolute;
      bottom: 25px;
      left: 20px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border-radius: 6px;
    }

    #controls {
      position: absolute;
      top: 95px;
      left: 50px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border-radius: 6px;
      line-height: 1.7;
    }

    #reset {
      position: absolute;
      top: 55px;
      left: 50px;
      z-index: 1000;
      padding: 7px 12px;
    }
  </style>
</head>
<body>

<div id="status">Click a start point, then a destination.</div>
<button id="reset" onclick="resetRoute()">Reset Route</button>

<div id="controls">
  <label><input type="checkbox" id="wheelchair" checked> Wheelchair</label><br>
  <label><input type="checkbox" id="avoidStairs" checked> Avoid stairs</label><br>
  <label>Max gradient:
    <select id="maxGradient">
      <option value="0.05">5%</option>
      <option value="0.08" selected>8%</option>
      <option value="0.10">10%</option>
      <option value="0.15">15%</option>
    </select>
  </label>
</div>
<div id="legend">
  <b>Routes</b><br>
  ━ Accessible route<br>
  - - Standard route
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const map = L.map("map").setView([53.4808, -2.2426], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

let startMarker;
let endMarker;
let routeLine;
let standardRouteLine;

function resetRoute() {
  if (startMarker) map.removeLayer(startMarker);
  if (endMarker) map.removeLayer(endMarker);
  if (routeLine) map.removeLayer(routeLine);
  if (standardRouteLine) map.removeLayer(standardRouteLine);

  startMarker = null;
  endMarker = null;
  routeLine = null;
  standardRouteLine = null;

  document.getElementById("status").innerText =
    "Click a start point, then a destination.";
}

map.on("click", async function(e) {

  if (!startMarker) {
    startMarker = L.marker(e.latlng).addTo(map).bindPopup("Start").openPopup();
    document.getElementById("status").innerText = "Now click your destination.";
    return;
  }

  if (!endMarker) {
    endMarker = L.marker(e.latlng).addTo(map).bindPopup("Destination").openPopup();
    document.getElementById("status").innerText = "Finding accessible route...";

    const response = await fetch("/routes/compare", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        origin: {
          latitude: startMarker.getLatLng().lat,
          longitude: startMarker.getLatLng().lng
        },
        destination: {
          latitude: endMarker.getLatLng().lat,
          longitude: endMarker.getLatLng().lng
        },
        profile: {
          wheelchair: document.getElementById("wheelchair").checked,
          avoid_stairs: document.getElementById("avoidStairs").checked,
          max_gradient: parseFloat(
            document.getElementById("maxGradient").value
          ),
          require_lift: false
        }
      })
    });

    const data = await response.json();

    if (!response.ok) {
      document.getElementById("status").innerText = "No accessible route found.";
      return;
    }

    const accessibleCoordinates = data.accessible_route.coordinates.map(
      point => [point.latitude, point.longitude]
    );

    const standardCoordinates = data.standard_route.coordinates.map(
      point => [point.latitude, point.longitude]
    );

    standardRouteLine = L.polyline(standardCoordinates, {
      dashArray: "8,8",
      weight: 4,
      opacity: 0.7
    }).addTo(map);

    routeLine = L.polyline(accessibleCoordinates, {
      weight: 6
    }).addTo(map);

    map.fitBounds(routeLine.getBounds());

    document.getElementById("status").innerText =
      `Normal: ${(data.standard_route.distance_m / 1000).toFixed(2)} km | ` +
      `Accessible: ${(data.accessible_route.distance_m / 1000).toFixed(2)} km | ` +
      `Score: ${data.accessible_route.accessibility_score}/100 | ` +
      `Extra: ${data.comparison.extra_distance_m.toFixed(0)} m`;
  }
});
</script>

</body>
</html>
