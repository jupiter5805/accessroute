<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AccessRoute Manchester</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  >

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
    }

    #panel {
      position: absolute;
      top: 20px;
      left: 50px;
      width: 350px;
      max-height: 92vh;
      overflow-y: auto;
      z-index: 1000;
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 14px rgba(0,0,0,.25);
    }

    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin-top: 6px;
      margin-bottom: 10px;
    }

    input[type="checkbox"] {
      width: auto;
    }

    input[type="range"] {
      padding: 0;
    }

    .results {
      max-height: 130px;
      overflow-y: auto;
    }

    .result {
      padding: 7px;
      cursor: pointer;
      border-bottom: 1px solid #ddd;
      font-size: 13px;
    }

    .result:hover {
      background: #eee;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    #riskValue {
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
    }

    #summary {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #ddd;
      font-size: 14px;
      line-height: 1.6;
    }

    .route-key {
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div id="panel">

  <h2>AccessRoute</h2>

  <p>
    Accessibility-aware journey planning around Manchester.
  </p>

  <label><b>From</b></label>

  <input
    id="originSearch"
    placeholder="Manchester Piccadilly"
  >

  <div
    id="originResults"
    class="results">
  </div>


  <label><b>To</b></label>

  <input
    id="destinationSearch"
    placeholder="Manchester Royal Infirmary"
  >

  <div
    id="destinationResults"
    class="results">
  </div>

  <hr>


  <label>
    <input
      type="checkbox"
      id="wheelchair"
      checked
    >
    Wheelchair accessible
  </label>

  <br>

  <label>
    <input
      type="checkbox"
      id="avoidStairs"
      checked
    >
    Avoid stairs
  </label>

  <br><br>


  <label>
    <b>Maximum gradient</b>
  </label>

  <select id="maxGradient">
    <option value="0.05">5%</option>
    <option value="0.08" selected>8%</option>
    <option value="0.10">10%</option>
    <option value="0.15">15%</option>
  </select>


  <hr>


  <label>
    <b>Route preference</b>
  </label>

  <input
    type="range"
    id="riskWeight"
    min="0"
    max="20"
    value="5"
    step="1"
  >

  <div class="slider-labels">
    <span>Shorter</span>
    <span>Safer</span>
  </div>

  <div id="riskValue">
    ML risk weighting: 5
  </div>


  <button onclick="calculateRoute()">
    Find route
  </button>

  <button onclick="resetRoute()">
    Reset
  </button>


  <div class="route-key">
    <b>Map:</b><br>
    Solid line = ML-aware route<br>
    Dashed line = standard accessible route
  </div>


  <div id="summary"></div>

</div>


<div id="map"></div>


<script
  src="https://unpkg.com/leaflet/dist/leaflet.js">
</script>


<script>

const map = L.map("map")
  .setView(
    [53.4808, -2.2426],
    13
  );


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);


let origin = null;
let destination = null;

let originMarker = null;
let destinationMarker = null;

let accessibleLine = null;
let mlLine = null;


const riskSlider =
  document.getElementById(
    "riskWeight"
  );


riskSlider.addEventListener(
  "input",
  function () {

    document.getElementById(
      "riskValue"
    ).innerText =
      `ML risk weighting: ${this.value}`;
  }
);


async function searchPlaces(text) {

  if (text.length < 3) {
    return [];
  }

  const response = await fetch(
    `/places/search?q=${
      encodeURIComponent(text)
    }`
  );

  if (!response.ok) {
    return [];
  }

  const data =
    await response.json();

  return data.results;
}


async function updateResults(
  input,
  resultBox,
  type
) {

  const results =
    await searchPlaces(
      input.value
    );

  resultBox.innerHTML = "";

  results.forEach(
    place => {

      const element =
        document.createElement(
          "div"
        );

      element.className =
        "result";

      element.innerText =
        place.name;

      element.onclick =
        () => {

          input.value =
            place.name;

          resultBox.innerHTML =
            "";

          selectPlace(
            type,
            place
          );
        };

      resultBox.appendChild(
        element
      );
    }
  );
}


function selectPlace(
  type,
  place
) {

  const position = [
    place.latitude,
    place.longitude
  ];


  if (type === "origin") {

    origin = place;

    if (originMarker) {
      map.removeLayer(
        originMarker
      );
    }

    originMarker =
      L.marker(position)
      .addTo(map)
      .bindPopup("Start");

  } else {

    destination = place;

    if (destinationMarker) {
      map.removeLayer(
        destinationMarker
      );
    }

    destinationMarker =
      L.marker(position)
      .addTo(map)
      .bindPopup(
        "Destination"
      );
  }


  map.setView(
    position,
    15
  );
}


document
  .getElementById(
    "originSearch"
  )
  .addEventListener(
    "input",
    event => {

      updateResults(
        event.target,
        document.getElementById(
          "originResults"
        ),
        "origin"
      );
    }
  );


document
  .getElementById(
    "destinationSearch"
  )
  .addEventListener(
    "input",
    event => {

      updateResults(
        event.target,
        document.getElementById(
          "destinationResults"
        ),
        "destination"
      );
    }
  );


async function calculateRoute() {

  const summary =
    document.getElementById(
      "summary"
    );


  if (!origin || !destination) {

    summary.innerText =
      "Please select both locations.";

    return;
  }


  summary.innerText =
    "Analysing routes...";


  const riskWeight =
    parseFloat(
      riskSlider.value
    );


  const response =
    await fetch(
      "/routes/ml-compare",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          origin: {
            latitude:
              origin.latitude,

            longitude:
              origin.longitude
          },

          destination: {
            latitude:
              destination.latitude,

            longitude:
              destination.longitude
          },

          profile: {

            wheelchair:
              document
              .getElementById(
                "wheelchair"
              )
              .checked,

            avoid_stairs:
              document
              .getElementById(
                "avoidStairs"
              )
              .checked,

            max_gradient:
              parseFloat(
                document
                .getElementById(
                  "maxGradient"
                )
                .value
              ),

            require_lift: false
          },

          ml_risk_weight:
            riskWeight
        })
      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    summary.innerText =
      data.detail ||
      "Unable to calculate route.";

    return;
  }


  if (accessibleLine) {
    map.removeLayer(
      accessibleLine
    );
  }

  if (mlLine) {
    map.removeLayer(
      mlLine
    );
  }


  const accessibleCoords =
    data
    .accessible_route
    .coordinates
    .map(
      point => [
        point.latitude,
        point.longitude
      ]
    );


  const mlCoords =
    data
    .ml_aware_route
    .coordinates
    .map(
      point => [
        point.latitude,
        point.longitude
      ]
    );


  accessibleLine =
    L.polyline(
      accessibleCoords,
      {
        dashArray: "8,8",
        weight: 4,
        opacity: 0.7
      }
    )
    .addTo(map);


  mlLine =
    L.polyline(
      mlCoords,
      {
        weight: 6
      }
    )
    .addTo(map);


  map.fitBounds(
    mlLine.getBounds()
  );


  const accessible =
    data.accessible_route;

  const ml =
    data.ml_aware_route;

  const tradeoff =
    data.tradeoff;


  let outcome = "";


  if (
    tradeoff.risk_reduction > 0
  ) {

    outcome =
      `<b>
        ${tradeoff
          .risk_reduction_percent
          .toFixed(1)}%
        lower ML accessibility risk
       </b>`;

  } else {

    outcome =
      "<b>Both routes have similar ML risk.</b>";
  }


  summary.innerHTML = `

    <strong>
      Standard accessible route
    </strong>

    <br>

    Distance:
    ${(accessible.distance_m / 1000)
      .toFixed(2)} km

    <br>

    Average ML risk:
    ${accessible.ml
      .average_risk_score}/100

    <br>

    Anomaly segments:
    ${accessible.ml
      .anomaly_segments}


    <br><br>


    <strong>
      ML-aware route
    </strong>

    <br>

    Distance:
    ${(ml.distance_m / 1000)
      .toFixed(2)} km

    <br>

    Average ML risk:
    ${ml.ml
      .average_risk_score}/100

    <br>

    Maximum segment risk:
    ${ml.ml
      .maximum_risk_score}/100

    <br>

    Anomaly segments:
    ${ml.ml
      .anomaly_segments}


    <br><br>


    <strong>
      Trade-off
    </strong>

    <br>

    Extra distance:
    ${tradeoff
      .extra_distance_m
      .toFixed(0)} m

    <br>

    Risk reduction:
    ${tradeoff
      .risk_reduction
      .toFixed(2)}
    points

    <br>

    ${outcome}

    <br><br>

    ML influence:
    ${tradeoff.risk_weight}/20
  `;
}


function resetRoute() {

  origin = null;
  destination = null;


  document.getElementById(
    "originSearch"
  ).value = "";


  document.getElementById(
    "destinationSearch"
  ).value = "";


  document.getElementById(
    "summary"
  ).innerHTML = "";


  if (originMarker) {
    map.removeLayer(
      originMarker
    );
  }

  if (destinationMarker) {
    map.removeLayer(
      destinationMarker
    );
  }

  if (accessibleLine) {
    map.removeLayer(
      accessibleLine
    );
  }

  if (mlLine) {
    map.removeLayer(
      mlLine
    );
  }


  originMarker = null;
  destinationMarker = null;
  accessibleLine = null;
  mlLine = null;


  riskSlider.value = 5;

  document.getElementById(
    "riskValue"
  ).innerText =
    "ML risk weighting: 5";


  map.setView(
    [53.4808, -2.2426],
    13
  );
}

</script>

</body>
</html>
